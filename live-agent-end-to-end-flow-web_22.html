 const rep=i=>{if(vis.has(i))return i;const pn=phaseOfNode(i);if(pn!==null&&lvl[pn]===1)return 'ph'+pn;return null};
 const paths=[];lblBox.innerHTML='';const drawn=new Set();
 const mk=(id,col)=>`<marker id="m${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${col}"/></marker>`;
 const SKIP=new Set(['1:25>1:28']);
 for(const cn of CONNS){if(SKIP.has(cn.a+'>'+cn.b))continue;let a=rep(cn.a),b=rep(cn.b);if(!a||!b||a===b)continue;const key=a+'>'+b;const l=cn.lbl||'';const ll=l.toLowerCase();const lk=ll.startsWith('yes')?'yes':ll.startsWith('no')?'no':'plain';
  if(lk==='no'&&(!vis.has(cn.b)))continue; // hide no-branches into collapsed content
  if(drawn.has(key))continue;drawn.add(key);
  const col={yes:'#6fae8a',no:'#cf8a8e',plain:'#b9b4a9'}[lk];let r=route(a,b,EP,l);let dash='';
  if(!r)continue;
  if(false){const[ax,ay,aw,ah]=EP[a],[bx,by,bw,bh]=EP[b];const lane=LANE0+34*lanes++;const rx=ax+aw+24,bcx=bx+bw/2;r={d:`M${ax+aw},${ay+ah/2} L${rx},${ay+ah/2} L${rx},${lane} L${bcx},${lane} L${bcx},${by+bh}`,lx:(rx+bcx)/2,ly:lane};dash='stroke-dasharray="6 5"'}
  paths.push(`<path d="${smooth(r.d)}" stroke="${col}" ${dash} ${r.noArrow?'':`marker-end="url(#m${lk})"`}/>`);
  if(l&&vis.has(cn.a)&&vis.has(cn.b)){const s=document.createElement('div');s.className='lbl '+lk;const m=l.match(/^(yes|no)\s*[·:-]?\s*(.*)$/i);s.innerHTML=m?`<span>${m[1]}</span>${m[2]?`<small>${m[2]}</small>`:''}`:l;s.style.left=r.lx+'px';s.style.top=r.ly+'px';lblBox.appendChild(s)}}
 const H=Math.max(...secs.map(s=>s[2]+s[4]))+(lanes?60+34*lanes:60);
 svg.innerHTML=`<defs>${mk('plain','#b9b4a9')}${mk('yes','#6fae8a')}${mk('no','#cf8a8e')}</defs>`+paths.join('');svg.setAttribute('width',W);svg.setAttribute('height',H);c.style.width=W+'px';c.style.height=H+'px';
 // scope box: from "Is a live agent available?" (or phase 3 if collapsed) to the end
 const s3=secs.find(s=>s[0].n===3),last=secs[secs.length-1];const vx=(vis.has('9:423')?P['9:423'][0]-30:s3[1]+s3[3]*0.55);const vt=Math.min(...secs.map(s=>s[2]))-28;
 Object.assign(scopeEl.style,{left:vx+'px',top:vt+'px',width:(last[1]+last[3]-vx+30)+'px',height:(Math.max(...secs.map(s=>s[2]+s[4]))-vt+28)+'px'});
 // level buttons reflect state
 const allC=PH.flatMap(condsOf);const all=Object.values(lvl);const g=all.every(v=>v===1)?1:all.every(v=>v===2)?(allC.every(c=>open.has(c))?3:allC.every(c=>!open.has(c))?2:0):0;document.querySelectorAll('.levels button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.l===g)));
 document.getElementById('hint').textContent=g===1?'Click a major step to expand it, or use the levels to expand everything.':g===2?'Happy path shown. Click a condition (or its ▸ badge) to reveal its unhappy path and edge cases.':g===3?'Full flow shown. Click a condition to collapse its edge cases, or a step header to collapse the step.':'Mixed detail — use the levels to reset.';
}
function cycle(n){const p=PH.find(p=>p.n===n),cs=condsOf(p);if(lvl[n]===1){lvl[n]=2}else if(cs.length&&!cs.every(c=>open.has(c))){cs.forEach(c=>open.add(c))}else{lvl[n]=1;cs.forEach(c=>open.delete(c))}render()}
document.querySelectorAll('.levels button').forEach(b=>b.onclick=()=>{const L=+b.dataset.l;PH.forEach(p=>{lvl[p.n]=L===1?1:2;condsOf(p).forEach(c=>L===3?open.add(c):open.delete(c))});render()});
document.getElementById('expandAll').onclick=()=>{PH.forEach(p=>{lvl[p.n]=2;condsOf(p).forEach(c=>open.add(c))});render()};document.getElementById('collapseAll').onclick=()=>{PH.forEach(p=>lvl[p.n]=1);open.clear();render()};
// click a condition to reveal its unhappy path
Object.entries(nodeEl).forEach(([i,el])=>el.onclick=e=>{e.stopPropagation();if(kind(N[i])==='cond'&&Object.values(srcOf).includes(i)){open.has(i)?open.delete(i):open.add(i);render()}});

const st=document.querySelector('.stage');let drag=null;st.addEventListener('mousedown',e=>{if(e.target.closest('.node,button,h2'))return;drag={x:e.clientX,y:e.clientY,l:st.scrollLeft,t:st.scrollTop};st.classList.add('grab')});
